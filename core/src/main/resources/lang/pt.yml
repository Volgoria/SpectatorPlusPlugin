# ============================================================================
#                 SPECTATOR PLUS - IDIOMA: PORTUGUÊS (pt)
# ============================================================================
# Para criar um novo idioma: copie este arquivo como <código>.yml (ex: it.yml)
# e traduza os textos. As chaves ausentes usam o idioma padrão.
# Usado automaticamente pelos clientes em pt_BR e pt_PT.
# ============================================================================
language:
  name: 'Português'
  changed: '&7Idioma: &b{language}'
  current: '&7Idioma atual: &b{language} &8| &7Disponíveis: &f{languages} &8(/spec lang <código|auto>)'

prefix: '&8[&bSpectator&3+&8] &r'

categories:
  world: '&2Mundo e dimensões'
  mining: '&7Mineração e blocos'
  player: '&eJogadores'
  pvp: '&cCombate PvP'
  death: '&4Morte / eliminação'
  craft: '&6Criação e itens'
  enchant: '&dEncantamentos'
  pve: '&aPvE e criaturas'
  potion: '&5Poções e efeitos'
  game: '&bProgresso da partida'
  custom: '&fEventos personalizados'

importance:
  LOW: '&8Baixa'
  NORMAL: '&7Normal'
  IMPORTANT: '&6Importante'
  CRITICAL: '&cCrítica'

player-mode:
  all: '&aTodos os jogadores'
  whitelist: '&fApenas a lista branca'
  blacklist: '&8Todos exceto a lista negra'
  followed: '&bApenas o jogador seguido'
  favorites: '&eApenas os favoritos'

placeholders:
  none: 'Nenhum'
  not-spectator: 'NENHUM'
  zone-enter: 'entra'
  zone-leave: 'sai'
  border-shrink: 'está diminuindo'
  border-grow: 'está aumentando'

help:
  - '&8&m-----------&r &bSpectator&3+ &8&m-----------'
  - '&b/{label} &7- Menu principal'
  - '&b/{label} join|leave [jogador] &7- Entrar / sair do modo espectador'
  - '&b/{label} tp <jogador> &7- Teleportar'
  - '&b/{label} follow <jogador|stop> &7- Seguir um jogador'
  - '&b/{label} pov <jogador|stop> &7- Visão em primeira pessoa'
  - '&b/{label} next|prev &7- Próximo / anterior jogador'
  - '&b/{label} inspect|inv|ec <jogador> &7- Ficha, inventário, baú do ender'
  - '&b/{label} filters|events|info|settings &7- Menus'
  - '&b/{label} preset <nome> &7- Trocar o preset de filtros'
  - '&b/{label} resetfilters [jogador|*] &7- Redefinir os filtros'
  - '&b/{label} lang <código|auto> &7- Trocar de idioma'
  - '&c/{label} list | freeze | unfreeze | eliminate &7- Administração'
  - '&c/{label} game <start|end|pvp|grace|episode|endepisode|winner|teamwin>'
  - '&c/{label} mode <MANUAL|SEMI_AUTO|AUTO> | event <id> | reload'

spectator:
  enter: '&7Agora você é &bespectador&7. Use os itens da sua barra de inventário.'
  leave: '&7Você saiu do modo espectador.'
  restored: '&7Seu modo espectador foi restaurado.'
  # Unité affichée sous le pseudo des joueurs (points de vie), visible par les spectateurs
  health-title: '&c❤'
  teleported: '&7Teleportado para &b{target}&7.'
  follow-start: '&7Você está seguindo &b{target}&7. &8(agachar + clique no olho para parar)'
  follow-stop: '&7Você não está mais seguindo ninguém.'
  target-lost: '&7O jogador seguido não está mais disponível.'
  pov-start: '&7Você vê pelos olhos de &b{target}&7. &8(agache para sair)'
  pov-stop: '&7Visão em primeira pessoa encerrada.'
  frozen: '&cVocê foi imobilizado.'
  unfrozen: '&aVocê pode se mover novamente.'

hud:
  following: '&bSeguindo: &f{target} &8| &c❤ {health}/{max_health} &8| &6Fome {food} &8| &7{distance}m &8| &7{world}'
  pov: '&dPOV: &f{target} &8| &c❤ {health}/{max_health} &8| &6Fome {food} &8| &7Kills: {kills}'
  free: '&7Vivos: &a{alive} &8| &7Espectadores: &b{spectators} &8| &7Partida: &f{time}'

events:
  hover: '&7Evento: &f{event}\n&7Importância: &f{priority}\n&eClique para teleportar até {player}'
  critical-title: '&c&l{event_name}'

filters:
  reset: '&7Seus filtros foram redefinidos.'
  preset-applied: '&7Preset aplicado: {preset}'
  presets: '&7Presets disponíveis: &f{presets}'

admin:
  joined: '&b{player} &7agora é espectador.'
  left: '&b{player} &7não é mais espectador.'
  list: '&7Espectadores (&b{count}&7): &f{players}'
  frozen: '&b{player} &7foi imobilizado.'
  unfrozen: '&b{player} &7foi liberado.'
  eliminated: '&c{player} &7foi eliminado.'
  mode: '&7Modo atual: &b{mode}'
  mode-set: '&7Modo alterado para &b{mode} &8(temporário, edite config.yml para mantê-lo)'
  game-updated: '&7Partida: ação &b{action} &7realizada.'
  event-fired: '&7Evento &b{event} &7disparado.'
  filters-reset: '&7Filtros de &b{player} &7redefinidos.'
  filters-reset-all: '&7Filtros de todos os jogadores conectados redefinidos.'
  reloaded: '&aConfiguração recarregada.'

errors:
  no-permission: '&cVocê não tem permissão.'
  player-only: '&cComando reservado aos jogadores.'
  not-spectator: '&cVocê precisa ser espectador.'
  not-spectator-other: '&c{player} não é espectador.'
  already-spectator: '&c{player} já é espectador.'
  enter-refused: '&cNão foi possível tornar {player} espectador (recusado por um plugin).'
  leave-refused: '&cNão foi possível tirar {player} do modo espectador (recusado por um plugin).'
  player-not-found: '&cJogador não encontrado: {player}'
  invalid-target: '&cAlvo inválido.'
  no-players: '&cNenhum jogador para seguir.'
  unknown-command: '&cComando desconhecido. &7/{label} help'
  unknown-preset: '&cPreset desconhecido: {preset}'
  unknown-event: '&cEvento desconhecido: {event}'
  usage: '&cUso: &7{usage}'
  filter-locked: '&cEste filtro está bloqueado.'
  command-blocked: '&cEste comando é proibido no modo espectador.'
  unknown-language: '&cIdioma desconhecido: {language}'

