# ============================================================================
#                 SPECTATOR PLUS - LANGUE : FRANÇAIS (fr)
# ============================================================================
# Pour créer une nouvelle langue : copier ce fichier en <code>.yml (ex : it.yml)
# et traduire les textes. Les clés manquantes utilisent la langue par défaut.
# ============================================================================
language:
  name: 'Français'
  changed: '&7Langue : &b{language}'
  current: '&7Langue actuelle : &b{language} &8| &7Disponibles : &f{languages} &8(/spec lang <code|auto>)'

prefix: '&8[&bSpectator&3+&8] &r'

# Noms des catégories d'évènements
categories:
  world: '&2Monde et dimensions'
  mining: '&7Minage et blocs'
  player: '&eJoueurs'
  pvp: '&cCombat PvP'
  death: '&4Mort / élimination'
  craft: '&6Crafts et objets'
  enchant: '&dEnchantements'
  pve: '&aPvE et créatures'
  potion: '&5Potions et effets'
  game: '&bProgression de la partie'
  custom: '&fÉvènements personnalisés'

importance:
  LOW: '&8Faible'
  NORMAL: '&7Normal'
  IMPORTANT: '&6Important'
  CRITICAL: '&cCritique'

player-mode:
  all: '&aTous les joueurs'
  whitelist: '&fUniquement la whitelist'
  blacklist: '&8Tous sauf la blacklist'
  followed: '&bUniquement le joueur suivi'
  favorites: '&eUniquement les favoris'

placeholders:
  none: 'Aucun'
  not-spectator: 'NONE'
  zone-enter: 'entre'
  zone-leave: 'sort'
  border-shrink: 'se rétrécit'
  border-grow: 's''agrandit'

help:
  - '&8&m-----------&r &bSpectator&3+ &8&m-----------'
  - '&b/{label} &7- Menu principal'
  - '&b/{label} join|leave [joueur] &7- Entrer / sortir du mode spectateur'
  - '&b/{label} tp <joueur> &7- Se téléporter'
  - '&b/{label} follow <joueur|stop> &7- Suivre un joueur'
  - '&b/{label} pov <joueur|stop> &7- Vue à la première personne'
  - '&b/{label} next|prev &7- Joueur suivant / précédent'
  - '&b/{label} inspect|inv|ec <joueur> &7- Fiche, inventaire, ender chest'
  - '&b/{label} filters|events|info|settings &7- Menus'
  - '&b/{label} preset <nom> &7- Changer de preset de filtres'
  - '&b/{label} resetfilters [joueur|*] &7- Réinitialiser les filtres'
  - '&b/{label} lang <code|auto> &7- Changer de langue'
  - '&c/{label} list | freeze | unfreeze | eliminate &7- Administration'
  - '&c/{label} game <start|end|pvp|grace|episode|endepisode|winner|teamwin>'
  - '&c/{label} mode <MANUAL|SEMI_AUTO|AUTO> | event <id> | reload'

spectator:
  enter: '&7Vous êtes maintenant &bspectateur&7. Utilisez les objets de votre barre d''inventaire.'
  leave: '&7Vous avez quitté le mode spectateur.'
  restored: '&7Votre mode spectateur a été restauré.'
  # Unité affichée sous le pseudo des joueurs (points de vie), visible par les spectateurs
  health-title: '&c❤'
  teleported: '&7Téléporté vers &b{target}&7.'
  follow-start: '&7Vous suivez &b{target}&7. &8(sneak + clic sur l''œil pour arrêter)'
  follow-stop: '&7Vous ne suivez plus personne.'
  target-lost: '&7Le joueur suivi n''est plus disponible.'
  pov-start: '&7Vous voyez à travers les yeux de &b{target}&7. &8(accroupissez-vous pour quitter)'
  pov-stop: '&7Vue à la première personne terminée.'
  frozen: '&cVous avez été immobilisé.'
  unfrozen: '&aVous pouvez de nouveau bouger.'

hud:
  following: '&bSuivi : &f{target} &8| &c❤ {health}/{max_health} &8| &6Faim {food} &8| &7{distance}m &8| &7{world}'
  pov: '&dPOV : &f{target} &8| &c❤ {health}/{max_health} &8| &6Faim {food} &8| &7Kills : {kills}'
  free: '&7Joueurs en vie : &a{alive} &8| &7Spectateurs : &b{spectators} &8| &7Partie : &f{time}'

events:
  hover: '&7Évènement : &f{event}\n&7Importance : &f{priority}\n&eCliquez pour vous téléporter à {player}'
  critical-title: '&c&l{event_name}'

filters:
  reset: '&7Vos filtres ont été réinitialisés.'
  preset-applied: '&7Preset appliqué : {preset}'
  presets: '&7Presets disponibles : &f{presets}'

admin:
  joined: '&b{player} &7est maintenant spectateur.'
  left: '&b{player} &7n''est plus spectateur.'
  list: '&7Spectateurs (&b{count}&7) : &f{players}'
  frozen: '&b{player} &7a été immobilisé.'
  unfrozen: '&b{player} &7a été libéré.'
  eliminated: '&c{player} &7a été éliminé.'
  mode: '&7Mode actuel : &b{mode}'
  mode-set: '&7Mode changé en &b{mode} &8(temporaire, modifiez config.yml pour le conserver)'
  game-updated: '&7Partie : action &b{action} &7effectuée.'
  event-fired: '&7Évènement &b{event} &7déclenché.'
  filters-reset: '&7Filtres de &b{player} &7réinitialisés.'
  filters-reset-all: '&7Filtres de tous les joueurs connectés réinitialisés.'
  reloaded: '&aConfiguration rechargée.'

errors:
  no-permission: '&cVous n''avez pas la permission.'
  player-only: '&cCommande réservée aux joueurs.'
  not-spectator: '&cVous devez être spectateur.'
  not-spectator-other: '&c{player} n''est pas spectateur.'
  already-spectator: '&c{player} est déjà spectateur.'
  enter-refused: '&cImpossible de passer {player} en spectateur (refusé par un plugin).'
  leave-refused: '&cImpossible de sortir {player} du mode spectateur (refusé par un plugin).'
  player-not-found: '&cJoueur introuvable : {player}'
  invalid-target: '&cCible invalide.'
  no-players: '&cAucun joueur à suivre.'
  unknown-command: '&cCommande inconnue. &7/{label} help'
  unknown-preset: '&cPreset inconnu : {preset}'
  unknown-event: '&cÉvènement inconnu : {event}'
  usage: '&cUtilisation : &7{usage}'
  filter-locked: '&cCe filtre est verrouillé.'
  command-blocked: '&cCette commande est interdite en mode spectateur.'
  unknown-language: '&cLangue inconnue : {language}'

