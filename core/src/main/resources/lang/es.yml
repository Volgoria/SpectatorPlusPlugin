# ============================================================================
#                 SPECTATOR PLUS - IDIOMA: ESPAÑOL (es)
# ============================================================================
# Para crear un nuevo idioma: copia este archivo como <código>.yml (ej: it.yml)
# y traduce los textos. Las claves que falten usan el idioma por defecto.
# ============================================================================
language:
  name: 'Español'
  changed: '&7Idioma: &b{language}'
  current: '&7Idioma actual: &b{language} &8| &7Disponibles: &f{languages} &8(/spec lang <código|auto>)'

prefix: '&8[&bSpectator&3+&8] &r'

categories:
  world: '&2Mundo y dimensiones'
  mining: '&7Minería y bloques'
  player: '&eJugadores'
  pvp: '&cCombate PvP'
  death: '&4Muerte / eliminación'
  craft: '&6Crafteos y objetos'
  enchant: '&dEncantamientos'
  pve: '&aPvE y criaturas'
  potion: '&5Pociones y efectos'
  game: '&bProgreso de la partida'
  custom: '&fEventos personalizados'

importance:
  LOW: '&8Baja'
  NORMAL: '&7Normal'
  IMPORTANT: '&6Importante'
  CRITICAL: '&cCrítica'

player-mode:
  all: '&aTodos los jugadores'
  whitelist: '&fSolo la lista blanca'
  blacklist: '&8Todos salvo la lista negra'
  followed: '&bSolo el jugador seguido'
  favorites: '&eSolo los favoritos'

placeholders:
  none: 'Ninguno'
  not-spectator: 'NINGUNO'
  zone-enter: 'entra'
  zone-leave: 'sale'
  border-shrink: 'se reduce'
  border-grow: 'se amplía'

help:
  - '&8&m-----------&r &bSpectator&3+ &8&m-----------'
  - '&b/{label} &7- Menú principal'
  - '&b/{label} join|leave [jugador] &7- Entrar / salir del modo espectador'
  - '&b/{label} tp <jugador> &7- Teletransportarse'
  - '&b/{label} follow <jugador|stop> &7- Seguir a un jugador'
  - '&b/{label} pov <jugador|stop> &7- Vista en primera persona'
  - '&b/{label} next|prev &7- Jugador siguiente / anterior'
  - '&b/{label} inspect|inv|ec <jugador> &7- Ficha, inventario, cofre de ender'
  - '&b/{label} filters|events|info|settings &7- Menús'
  - '&b/{label} preset <nombre> &7- Cambiar el preset de filtros'
  - '&b/{label} resetfilters [jugador|*] &7- Restablecer los filtros'
  - '&b/{label} lang <código|auto> &7- Cambiar de idioma'
  - '&c/{label} list | freeze | unfreeze | eliminate &7- Administración'
  - '&c/{label} game <start|end|pvp|grace|episode|endepisode|winner|teamwin>'
  - '&c/{label} mode <MANUAL|SEMI_AUTO|AUTO> | event <id> | reload'

spectator:
  enter: '&7Ahora eres &bespectador&7. Usa los objetos de tu barra de inventario.'
  leave: '&7Has salido del modo espectador.'
  restored: '&7Tu modo espectador ha sido restaurado.'
  # Unité affichée sous le pseudo des joueurs (points de vie), visible par les spectateurs
  health-title: '&c❤'
  teleported: '&7Teletransportado a &b{target}&7.'
  follow-start: '&7Estás siguiendo a &b{target}&7. &8(agáchate + clic en el ojo para parar)'
  follow-stop: '&7Ya no sigues a nadie.'
  target-lost: '&7El jugador seguido ya no está disponible.'
  pov-start: '&7Ves a través de los ojos de &b{target}&7. &8(agáchate para salir)'
  pov-stop: '&7Vista en primera persona terminada.'
  frozen: '&cHas sido inmovilizado.'
  unfrozen: '&aYa puedes moverte de nuevo.'

hud:
  following: '&bSiguiendo: &f{target} &8| &c❤ {health}/{max_health} &8| &6Hambre {food} &8| &7{distance}m &8| &7{world}'
  pov: '&dPOV: &f{target} &8| &c❤ {health}/{max_health} &8| &6Hambre {food} &8| &7Kills: {kills}'
  free: '&7Vivos: &a{alive} &8| &7Espectadores: &b{spectators} &8| &7Partida: &f{time}'

events:
  hover: '&7Evento: &f{event}\n&7Importancia: &f{priority}\n&eHaz clic para teletransportarte a {player}'
  critical-title: '&c&l{event_name}'

filters:
  reset: '&7Tus filtros han sido restablecidos.'
  preset-applied: '&7Preset aplicado: {preset}'
  presets: '&7Presets disponibles: &f{presets}'

admin:
  joined: '&b{player} &7ahora es espectador.'
  left: '&b{player} &7ya no es espectador.'
  list: '&7Espectadores (&b{count}&7): &f{players}'
  frozen: '&b{player} &7ha sido inmovilizado.'
  unfrozen: '&b{player} &7ha sido liberado.'
  eliminated: '&c{player} &7ha sido eliminado.'
  mode: '&7Modo actual: &b{mode}'
  mode-set: '&7Modo cambiado a &b{mode} &8(temporal, edita config.yml para conservarlo)'
  game-updated: '&7Partida: acción &b{action} &7realizada.'
  event-fired: '&7Evento &b{event} &7lanzado.'
  filters-reset: '&7Filtros de &b{player} &7restablecidos.'
  filters-reset-all: '&7Filtros de todos los jugadores conectados restablecidos.'
  reloaded: '&aConfiguración recargada.'

errors:
  no-permission: '&cNo tienes permiso.'
  player-only: '&cComando reservado a los jugadores.'
  not-spectator: '&cDebes ser espectador.'
  not-spectator-other: '&c{player} no es espectador.'
  already-spectator: '&c{player} ya es espectador.'
  enter-refused: '&cNo se puede pasar a {player} a espectador (rechazado por un plugin).'
  leave-refused: '&cNo se puede sacar a {player} del modo espectador (rechazado por un plugin).'
  player-not-found: '&cJugador no encontrado: {player}'
  invalid-target: '&cObjetivo no válido.'
  no-players: '&cNingún jugador que seguir.'
  unknown-command: '&cComando desconocido. &7/{label} help'
  unknown-preset: '&cPreset desconocido: {preset}'
  unknown-event: '&cEvento desconocido: {event}'
  usage: '&cUso: &7{usage}'
  filter-locked: '&cEste filtro está bloqueado.'
  command-blocked: '&cEste comando está prohibido en modo espectador.'
  unknown-language: '&cIdioma desconocido: {language}'

