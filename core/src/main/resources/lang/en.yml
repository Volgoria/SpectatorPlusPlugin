# ============================================================================
#                 SPECTATOR PLUS - LANGUAGE: ENGLISH (en)
# ============================================================================
# To create a new language: copy this file to <code>.yml (e.g. it.yml)
# and translate the texts. Missing keys fall back to the default language.
# ============================================================================
language:
  name: 'English'
  changed: '&7Language: &b{language}'
  current: '&7Current language: &b{language} &8| &7Available: &f{languages} &8(/spec lang <code|auto>)'

prefix: '&8[&bSpectator&3+&8] &r'

categories:
  world: '&2World & dimensions'
  mining: '&7Mining & blocks'
  player: '&ePlayers'
  pvp: '&cPvP combat'
  death: '&4Death / elimination'
  craft: '&6Crafting & items'
  enchant: '&dEnchanting'
  pve: '&aPvE & mobs'
  potion: '&5Potions & effects'
  game: '&bGame progress'
  custom: '&fCustom events'

importance:
  LOW: '&8Low'
  NORMAL: '&7Normal'
  IMPORTANT: '&6Important'
  CRITICAL: '&cCritical'

player-mode:
  all: '&aAll players'
  whitelist: '&fWhitelist only'
  blacklist: '&8Everyone except blacklist'
  followed: '&bFollowed player only'
  favorites: '&eFavorites only'

placeholders:
  none: 'None'
  not-spectator: 'NONE'
  zone-enter: 'enters'
  zone-leave: 'leaves'
  border-shrink: 'is shrinking'
  border-grow: 'is growing'

help:
  - '&8&m-----------&r &bSpectator&3+ &8&m-----------'
  - '&b/{label} &7- Main menu'
  - '&b/{label} join|leave [player] &7- Enter / leave spectator mode'
  - '&b/{label} tp <player> &7- Teleport'
  - '&b/{label} follow <player|stop> &7- Follow a player'
  - '&b/{label} pov <player|stop> &7- First-person view'
  - '&b/{label} next|prev &7- Next / previous player'
  - '&b/{label} inspect|inv|ec <player> &7- Profile, inventory, ender chest'
  - '&b/{label} filters|events|info|settings &7- Menus'
  - '&b/{label} preset <name> &7- Change filter preset'
  - '&b/{label} resetfilters [player|*] &7- Reset filters'
  - '&b/{label} lang <code|auto> &7- Change language'
  - '&c/{label} list | freeze | unfreeze | eliminate &7- Administration'
  - '&c/{label} game <start|end|pvp|grace|episode|endepisode|winner|teamwin>'
  - '&c/{label} mode <MANUAL|SEMI_AUTO|AUTO> | event <id> | reload'

spectator:
  enter: '&7You are now a &bspectator&7. Use the items in your hotbar.'
  leave: '&7You left spectator mode.'
  restored: '&7Your spectator mode has been restored.'
  # Unité affichée sous le pseudo des joueurs (points de vie), visible par les spectateurs
  health-title: '&c❤'
  teleported: '&7Teleported to &b{target}&7.'
  follow-start: '&7You are following &b{target}&7. &8(sneak + click the eye to stop)'
  follow-stop: '&7You are no longer following anyone.'
  target-lost: '&7The followed player is no longer available.'
  pov-start: '&7You are seeing through &b{target}&7''s eyes. &8(sneak to exit)'
  pov-stop: '&7First-person view ended.'
  frozen: '&cYou have been frozen.'
  unfrozen: '&aYou can move again.'

hud:
  following: '&bFollowing: &f{target} &8| &c❤ {health}/{max_health} &8| &6Food {food} &8| &7{distance}m &8| &7{world}'
  pov: '&dPOV: &f{target} &8| &c❤ {health}/{max_health} &8| &6Food {food} &8| &7Kills: {kills}'
  free: '&7Alive: &a{alive} &8| &7Spectators: &b{spectators} &8| &7Game: &f{time}'

events:
  hover: '&7Event: &f{event}\n&7Importance: &f{priority}\n&eClick to teleport to {player}'
  critical-title: '&c&l{event_name}'

filters:
  reset: '&7Your filters have been reset.'
  preset-applied: '&7Preset applied: {preset}'
  presets: '&7Available presets: &f{presets}'

admin:
  joined: '&b{player} &7is now a spectator.'
  left: '&b{player} &7is no longer a spectator.'
  list: '&7Spectators (&b{count}&7): &f{players}'
  frozen: '&b{player} &7has been frozen.'
  unfrozen: '&b{player} &7has been released.'
  eliminated: '&c{player} &7has been eliminated.'
  mode: '&7Current mode: &b{mode}'
  mode-set: '&7Mode changed to &b{mode} &8(temporary, edit config.yml to keep it)'
  game-updated: '&7Game: action &b{action} &7done.'
  event-fired: '&7Event &b{event} &7fired.'
  filters-reset: '&7Filters of &b{player} &7reset.'
  filters-reset-all: '&7Filters of all online players reset.'
  reloaded: '&aConfiguration reloaded.'

errors:
  no-permission: '&cYou do not have permission.'
  player-only: '&cThis command is for players only.'
  not-spectator: '&cYou must be a spectator.'
  not-spectator-other: '&c{player} is not a spectator.'
  already-spectator: '&c{player} is already a spectator.'
  enter-refused: '&cCould not make {player} a spectator (refused by a plugin).'
  leave-refused: '&cCould not remove {player} from spectator mode (refused by a plugin).'
  player-not-found: '&cPlayer not found: {player}'
  invalid-target: '&cInvalid target.'
  no-players: '&cNo player to follow.'
  unknown-command: '&cUnknown command. &7/{label} help'
  unknown-preset: '&cUnknown preset: {preset}'
  unknown-event: '&cUnknown event: {event}'
  usage: '&cUsage: &7{usage}'
  filter-locked: '&cThis filter is locked.'
  command-blocked: '&cThis command is not allowed in spectator mode.'
  unknown-language: '&cUnknown language: {language}'

# ============================================================================
#                                 MENUS
# ============================================================================
gui:
  common:
    back: '&7← Back'
    close: '&cClose'
    next: '&aNext page →'
    previous: '&a← Previous page'
    page: '&fPage {page}/{pages}'
    enabled: '&aEnabled'
    disabled: '&cDisabled'
    locked: '&8Locked'
    click-toggle: '&eClick to toggle'
    'yes': '&aYes'
    'no': '&cNo'
    all: 'all'
    unlimited: 'unlimited'
    blocks: 'blocks'
    number-help:
      - '&eLeft click: +{step} &7| &eRight click: -{step}'
      - '&eShift: x4 &7| &eMiddle click: reset to 0'

  main:
    title: '&8Spectator Plus'
    info:
      name: '&bGame information'
      description: [ '&7Duration, players, border, episode...' ]
      lore:
        - '&7State: &f{state}'
        - '&7Target: &f{target}'
        - '&7Preset: &f{preset}'
    teleport:
      name: '&bTeleport'
      lore: [ '&7Teleport to an alive player.' ]
    players:
      name: '&ePlayers'
      lore: [ '&7Detailed list and player profiles.' ]
    follow:
      name: '&aFollow a player'
      lore: [ '&7Left click: choose a player', '&7Right click: stop following' ]
    pov:
      name: '&dFirst-person view'
      lore: [ '&7See through a player''s eyes.' ]
    history:
      name: '&6Event history'
      lore: [ '&7Everything that happened this game.' ]
    inventories:
      name: '&6Inventories'
      lore: [ '&7View a player''s inventory.' ]
    filters:
      name: '&cFilters'
      lore: [ '&7Choose which events are shown.' ]
    settings:
      name: '&7Settings'
      lore: [ '&7Fly speed, HUD, sounds...' ]
    leave:
      name: '&cLeave spectator mode'
      lore: [ '&7Get your original state back.' ]

  players:
    title:
      teleport: '&8Teleport &7({page})'
      players: '&8Players &7({page})'
      follow: '&8Follow a player &7({page})'
      pov: '&8POV view &7({page})'
      inventory: '&8Inventories &7({page})'
    name: '&e{player}'
    lore:
      - '&c❤ &f{health}&7/{max_health}  &6Food &f{food}  &a✦ &f{level}'
      - '&7World: &f{world} &8({x}, {y}, {z})'
      - '&7Distance: &f{distance}m'
      - '&7Team: &f{team}'
      - '&7Kills: &f{kills}'
    followed: '&b► Currently followed'
    click:
      teleport: [ '', '&eClick to teleport' ]
      players: [ '', '&eClick to open the profile' ]
      follow: [ '', '&eClick to follow this player' ]
      pov: [ '', '&eClick to see through their eyes' ]
      inventory: [ '', '&eLeft click: inventory', '&eRight click: ender chest' ]
    empty: '&cNo player alive'
    count: '&7{count} player(s) alive'

  sheet:
    title: '&8Profile of {player}'
    head:
      - '&7Team: &f{team}'
      - '&7Game mode: &f{gamemode}'
      - '&7Alive: {alive}'
    health: '&cHealth: &f{health}&7/{max_health} ❤'
    absorption: '&7Absorption: &e{absorption} ❤'
    food: '&6Food: &f{food}&7/20 &8(saturation {saturation})'
    level: '&aLevel: &f{level}'
    effects: '&5Active effects'
    effect-line: '&7- &f{effect} {level} &8({duration})'
    no-effect: '&7No effect'
    location: '&bLocation'
    location-lore:
      - '&7World: &f{world}'
      - '&7X: &f{x} &7Y: &f{y} &7Z: &f{z}'
      - '&7Biome: &f{biome}'
    stats: '&cStatistics'
    stats-lore:
      - '&7Kills: &f{kills}'
      - '&7Deaths: &f{deaths}'
      - '&7Streak: &f{streak}'
    armor: '&bArmor'
    teleport: '&bTeleport'
    follow: '&aFollow'
    pov: '&dPOV view'
    inventory: '&6View inventory'
    enderchest: '&5View ender chest'
    favorite: '&eAdd to favorites'
    unfavorite: '&6Remove from favorites'

  inspect:
    title: '&8Inventory of {player}'
    title-enderchest: '&8Ender chest of {player}'
    armor-slot:
      '0': '&7Empty helmet'
      '1': '&7Empty chestplate'
      '2': '&7Empty leggings'
      '3': '&7Empty boots'
    offhand: '&7Empty off-hand'
    status: '&cStatus'
    status-lore:
      - '&7Health: &f{health}&7/{max_health} ❤'
      - '&7Food: &f{food}&7/20'
      - '&7Level: &f{level}'
      - '&7Selected slot: &f{slot}'

  history:
    title: '&8Events &7({page})'
    lore:
      - ''
      - '&7Time: &f{time}'
      - '&7Category: {category}'
      - '&7Importance: &f{priority}'
    click: '&eClick: go to the player &7| &eRight click: go to the location'
    empty: '&cNo event'
    show-all: '&fShowing: &aAll events'
    show-filtered: '&fShowing: &eMy filters'
    count: '&7{count} event(s)'
    clear: '&cClear history &7(Shift + click)'

  filters:
    title: '&8Event filters'
    state:
      enabled: '&a● Enabled'
      disabled: '&c● Disabled'
      partial: '&e● Partially enabled'
      locked: '&7● Unavailable'
    category-lore:
      - ''
      - '&eLeft click: view events'
      - '&eRight click: enable / disable'
    customized-suffix: ' &7(modified)'
    preset:
      name: '&fPreset'
      lore: [ '&7Current: {preset}', '&eClick to change' ]
    importance:
      name: '&6Minimum importance'
      lore: [ '&7Current: {importance}', '&eLeft / right click to change' ]
    players:
      name: '&ePlayer filters'
      lore: [ '&7Whitelist, blacklist, favorites, teams' ]
    worlds:
      name: '&2World filters'
      lore: [ '&7Overworld, Nether, End...' ]
    distance:
      name: '&bDistance filters'
      lore: [ '&7Distance, chunk, world, zone' ]
    damage:
      name: '&cDamage filters'
      lore: [ '&7Thresholds, types, PvP / PvE' ]
    reset:
      name: '&4Reset'
      lore: [ '&7Go back to the default preset', '&eShift + click to confirm' ]

  category:
    title: '&8{category}'
    event-lore:
      - '&8{id}'
      - '&7Importance: {priority}'
    forced: '&6Enforced by the administrator'
    disabled-admin: '&8Disabled by the administrator'
    enable-all: '&aEnable all'
    disable-all: '&cDisable all'

  presets:
    title: '&8Filter presets'
    importance: '&7Minimum importance: {importance}'
    current: '&a✔ Current preset'
    click: '&eClick to apply'

  player-filters:
    title: '&8Player filters'
    head-lore:
      - '&7Whitelist: {whitelist}'
      - '&7Blacklist: {blacklist}'
      - '&7Favorite: {favorite}'
      - ''
      - '&eLeft click: favorite'
      - '&eRight click: whitelist'
      - '&eShift + click: blacklist'
    mode:
      name: '&fFilter mode'
      lore: [ '&7Current: {mode}', '&eClick to change' ]
    hide-own: 'Hide my own events'
    teams:
      name: '&fFollowed teams'
      lore: [ '&7{count} team(s) selected', '&8None = all teams', '&eClick to choose' ]
    help:
      name: '&7Help'
      lore:
        - '&7All: no filter'
        - '&7Whitelist: only these players'
        - '&7Blacklist: everyone except these players'
        - '&7Followed: the player you follow'
        - '&7Favorites: only your favorites'

  team-filters:
    title: '&8Followed teams'
    empty: '&cNo team detected'
    info: '&7No team selected = all teams'
    clear: '&cUncheck all'

  world-filters:
    title: '&8World filters'
    overworld: 'Overworld'
    nether: 'Nether'
    end: 'End'
    custom: 'Custom worlds'
    current-only: 'Only my current world'

  distance-filters:
    title: '&8Distance filters'
    max:
      name: '&bMaximum distance'
      lore: [ '&7Current: &f{value}' ]
    min:
      name: '&bMinimum distance'
      lore: [ '&7Current: &f{value}' ]
    same-chunk: 'Same chunk only'
    same-world: 'Same world only'
    same-zone: 'Same zone only'

  damage-filters:
    title: '&8Damage filters'
    types-title: '&8Damage types'
    min:
      name: '&cMinimum damage (HP)'
      lore: [ '&7Current: &f{value}' ]
    max:
      name: '&cMaximum damage (HP)'
      lore: [ '&7Current: &f{value}' ]
    pvp-only: 'PvP damage only'
    pve-only: 'PvE damage only'
    critical-only: 'Critical hits only'
    types:
      name: '&6Damage types'
      lore: [ '&7Selection: &f{count}', '&eClick to choose' ]
    types-info: '&7No type selected = all types'
    types-clear: '&cUncheck all'

  game-info:
    title: '&8Game information'
    duration: '&bDuration'
    duration-lore: [ '&7Game running: {running}', '&7Duration: &f{time}' ]
    alive: '&aAlive players'
    alive-lore: [ '&7Alive: &f{alive}', '&7At start: &f{initial}' ]
    dead: '&cEliminated players'
    dead-lore: [ '&7Eliminated: &f{eliminated}', '&7Spectators: &f{spectators}' ]
    teams: '&eTeams'
    teams-lore: [ '&7Remaining teams: &f{teams}' ]
    border: '&6World border'
    border-lore: [ '&7World: &f{world}', '&7Size: &f{size}', '&7Center: &f{x}, {z}' ]
    episode: '&dEpisode'
    episode-lore: [ '&7Current episode: &f{episode}' ]
    pvp: '&cPvP'
    pvp-lore: [ '&7PvP enabled: {pvp}' ]
    server: '&fServer'
    server-lore: [ '&7Players: &f{online}', '&7TPS: &f{tps}', '&7Mode: &f{mode}' ]

  settings:
    title: '&8Settings'
    value: '&7Value: &f{value}'
    left-right: '&eLeft click: + &7| &eRight click: -'
    fly-speed:
      name: '&bFly speed'
      lore: [ '&7Movement speed while flying.' ]
    see-spectators:
      name: '&bSee spectators'
      lore: [ '&7Show other spectators.' ]
    sounds:
      name: '&eSounds'
      lore: [ '&7Menu and notification sounds.' ]
    action-bar:
      name: '&fHUD (action bar)'
      lore: [ '&7Info about the followed player', '&7above the hotbar.' ]
    titles:
      name: '&cTitles'
      lore: [ '&7On-screen title for', '&7critical events.' ]
    chat-events:
      name: '&7Events in chat'
      lore: [ '&7Receive the event feed.' ]
    show-time:
      name: '&7Event time'
      lore: [ '&7Show the time before each message.' ]
    rate-limit:
      name: '&6Anti-spam'
      lore: [ '&7Maximum number of messages', '&7per second (except important ones).' ]
    follow-distance:
      name: '&aFollow distance'
      lore: [ '&7Camera distance in follow mode.' ]
    noclip:
      name: '&bNoclip'
      lore: [ '&7Fly through blocks.' ]
    language:
      name: '&fLanguage'
      lore: [ '&7Language of messages and menus.' ]
      auto: 'Automatic ({language})'

