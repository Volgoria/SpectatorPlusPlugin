# ============================================================================
#                              SPECTATOR PLUS
#                   Compatible Minecraft 1.8 → 26.x
# ============================================================================
# Matériaux : syntaxe « MODERNE|LEGACY:data » pour être compatible avec toutes
# les versions. Ex : LIME_STAINED_GLASS_PANE|STAINED_GLASS_PANE:5
# Les textes sont dans lang/<langue>.yml, les évènements dans events.yml.
# ============================================================================

# Langues : fichiers de plugins/SpectatorPlus/lang/ (fr, en, es, de, pt fournis).
# Pour ajouter une langue : copier en.yml en xx.yml (code ISO) et le traduire.
language:
  # Langue par défaut (console, joueurs dont la langue n'existe pas)
  default: fr
  # Utiliser automatiquement la langue du client Minecraft de chaque joueur
  per-player: true

# Mode de passage en spectateur :
#  MANUAL    : seul un plugin externe (API) ou une commande fait entrer un joueur en spectateur.
#  SEMI_AUTO : Spectator Plus détecte (mort...) mais un plugin peut annuler via SpectatorEnterEvent.
#  AUTO      : Spectator Plus gère tout, l'annulation est ignorée.
mode: AUTO

# Déclencheurs automatiques (modes SEMI_AUTO et AUTO)
auto:
  # Un joueur qui meurt devient spectateur
  on-death: true
  # Réapparition instantanée (pas d'écran de mort)
  instant-respawn: true
  # Le spectateur apparaît à l'endroit de sa mort
  teleport-to-death-location: true
  # Un joueur qui rejoint pendant une partie (non participant) devient spectateur
  join-during-game: true

# Comportement des spectateurs
spectator:
  # Garder le mode spectateur après une déconnexion
  keep-on-quit: true
  # Garder les spectateurs après un redémarrage / reload
  persist-on-restart: true
  # À la sortie : SAVED (position d'origine), SPAWN (spawn du monde), NONE (sur place)
  leave-teleport: SAVED
  # Retirer les effets de potion en entrant
  clear-effects: true
  # Vision nocturne pour mieux observer
  night-vision: true
  # Ajoute aussi l'effet d'invisibilité (les spectateurs sont déjà cachés via l'API)
  invisibility-effect: false
  # Passe-muraille : au contact d'un bloc, le spectateur passe temporairement en mode
  # Spectator vanilla pour le traverser, puis revient en Adventure à l'air libre.
  # (En Adventure, les collisions sont calculées par le client : impossible autrement.)
  # Chaque joueur peut le désactiver dans ses paramètres.
  noclip:
    enabled: true
    # Distance de détection autour de la hitbox (blocs)
    margin: 0.45
  # Empêcher les spectateurs d'ouvrir les inventaires du monde (coffres, machines de mods,
  # ender chest via une commande...). Les menus des plugins restent accessibles.
  # Contournement : permission spectatorplus.bypass.inventories
  block-world-inventories: true
  # Autoriser les portails
  allow-portals: false
  # Clic droit sur un joueur : INVENTORY, SHEET (fiche), FOLLOW, NONE
  right-click-player: INVENTORY
  # Clic gauche sur un joueur : ouvre sa fiche
  left-click-opens-sheet: true
  # Commandes interdites aux spectateurs (sans le « / »)
  blocked-commands: [ tpa, tpaccept, home, spawn, warp, back ]
  chat:
    # Le chat des spectateurs n'est visible que par les spectateurs (et spectatorplus.chat.see)
    separate: true
    prefix: '&7[Spectateur] '

# Mode suivi (follow) : caméra fluide (vélocité), sans téléportations en boucle.
# Le spectateur garde le contrôle de sa vue et peut tourner autour de la cible avec ZQSD.
follow:
  # SMOOTH : garde la distance, du côté où se trouve le spectateur (recommandé, idéal en combat)
  # BEHIND : toujours dans le dos de la cible
  # LEASH  : totalement libre, ramené en douceur s'il s'éloigne de plus de leash-distance
  style: SMOOTH
  # Hauteur de la caméra au-dessus des pieds de la cible
  height: 1.5
  # Réactivité (0.05 = très doux, 1 = collé à la cible)
  smoothness: 0.25
  # Vitesse maximale (blocs / tick)
  max-speed: 2.5
  # Au-delà de cette distance, téléportation directe (cible téléportée, perle...)
  teleport-distance: 32
  leash-distance: 12
  # Passer automatiquement au joueur suivant si la cible meurt / se déconnecte
  auto-next-on-target-lost: true

# Vue à la première personne (utilise le mode Spectator vanilla temporairement)
pov:
  enabled: true

# Barre d'action (HUD)
hud:
  show-when-free: true

# Barre d'inventaire du spectateur (slots 1 à 9). Chaque objet peut être déplacé ou supprimé.
# Noms et descriptions : lang/<langue>.yml → hotbar (ou « name » / « lore » ici pour les imposer).
# Actions : teleport, players, follow, events, menu, inventories, filters, info, settings, pov, leave
# Une action inconnue exécute « command » (ex : command: 'warp lobby').
hotbar:
  enabled: true
  items:
    teleport:
      slot: 1
      material: 'COMPASS'
    players:
      slot: 2
      material: 'PLAYER_HEAD|SKULL_ITEM:3'
    follow:
      slot: 3
      material: 'ENDER_EYE|EYE_OF_ENDER'
    events:
      slot: 4
      material: 'BOOK'
    menu:
      slot: 5
      material: 'NETHER_STAR'
    inventories:
      slot: 6
      material: 'CHEST'
    filters:
      slot: 7
      material: 'HOPPER'
    info:
      slot: 8
      material: 'CLOCK|WATCH'
    settings:
      slot: 9
      material: 'COMPARATOR|REDSTONE_COMPARATOR'
    leave:
      enabled: false
      slot: 9
      material: 'OAK_DOOR|WOOD_DOOR'
      permission: 'spectatorplus.leave'

# Diffusion des évènements
events:
  # Nombre d'évènements conservés dans l'historique
  history-size: 500
  # Les joueurs non spectateurs avec spectatorplus.events.receive reçoivent aussi les évènements
  staff-receive: true
  # Clic sur un message : téléportation vers le joueur concerné
  clickable: true
  # Titre à l'écran pour les évènements CRITICAL
  critical-title: true
  log-to-console: false
  # Mondes où aucun évènement n'est généré
  disabled-worlds: [ ]
  # Modes de jeu ignorés (joueurs qui ne génèrent pas d'évènements)
  ignore-gamemodes: [ CREATIVE, SPECTATOR ]
  # Format : {time} (si activé par le joueur), {prefix} (selon l'importance), {message}
  format: '{time}{prefix}{message}'
  time-format: '&8[{time}] '
  priority-prefix:
    LOW: '&8● '
    NORMAL: '&7● '
    IMPORTANT: '&6✦ '
    CRITICAL: '&c&l⚠ '

# Zones personnalisées (évènements world.zone_enter / world.zone_leave, filtre « même zone »)
zones:
  centre:
    name: 'Centre de la carte'
    world: world
    pos1: { x: -50, y: 0, z: -50 }
    pos2: { x: 50, y: 255, z: 50 }

# Progression de la partie
game:
  # À la fin de la partie, les spectateurs retrouvent leur état d'origine
  release-spectators-on-end: false
  # Annoncer joueurs / équipes restants et dernier survivant même sans partie
  # démarrée (/spec game start ou API). Utile si aucun plugin de jeu n'est utilisé.
  detect-without-game: false

# Stockage des préférences : YAML, SQLITE ou MYSQL
storage:
  type: YAML
  sqlite:
    file: database.db
    table-prefix: spectatorplus_
  mysql:
    host: localhost
    port: 3306
    database: spectatorplus
    username: root
    password: ''
    options: 'useSSL=false&autoReconnect=true&characterEncoding=utf8'
    table-prefix: spectatorplus_

# API
api:
  # Les plugins externes peuvent faire entrer / sortir des joueurs du mode spectateur
  allow-enter-leave: true

# Interfaces
gui:
  # Couleur de la vitre de fond (NONE pour désactiver)
  filler-color: BLACK
  distance-step: 25

# ============================================================================
#                                  FILTRES
# ============================================================================
filters:
  admin:
    # Les joueurs peuvent personnaliser leurs filtres
    allow-personal-filters: true
    # Preset appliqué à la première connexion
    default-preset: standard
    # Évènements désactivés pour tout le monde (motifs : pvp.*, death.first_death...)
    disabled-events: [ ]
    # Évènements impossibles à masquer
    forced-events: [ game.start, game.end, game.player_win, game.team_win ]
    # Filtres réservés : nécessitent spectatorplus.filter.<clé>
    # Clés : catégories (world, mining, player, pvp, death, craft, enchant, pve, potion, game, custom)
    #        + player, world, distance, damage, importance, preset
    restricted-filters: [ ]
  # Valeurs par défaut des nouveaux joueurs
  defaults:
    players:
      mode: ALL
      hide-own: false
    worlds:
      overworld: true
      nether: true
      end: true
      custom: true
      current-only: false
    distance:
      max: 0
      min: 0
      same-chunk: false
      same-world: false
      same-zone: false
    damage:
      min: 0
      max: 0
      types: [ ]
      pvp-only: false
      pve-only: false
      critical-only: false
    time:
      rate-limit: 6
      show-time: false
    settings:
      fly-speed: 2
      see-spectators: true
      sounds: true
      action-bar: true
      titles: true
      chat-events: true
      follow-distance: 4
      noclip: true
      # auto = langue du client, sinon code de langue (fr, en...)
      language: auto

# Presets de filtres (noms et descriptions : lang/<langue>.yml → presets)
# include / exclude : '*' (tout), 'pvp.*' (préfixe), '@custom' (catégorie), 'pvp.first_kill' (précis)
presets:
  all:
    icon: 'LIME_WOOL|WOOL:5'
    minimum-priority: LOW
    include: [ '*' ]
  standard:
    icon: 'WHITE_WOOL|WOOL:0'
    minimum-priority: NORMAL
    include: [ '*' ]
    exclude: [ 'player.damage', 'pvp.attack', 'pvp.damage_dealt', 'pvp.damage_taken', 'pvp.critical',
               'pvp.shield_block', 'mining.block_break', 'mining.block_place', 'craft.pickup', 'craft.drop',
               'pve.attack', 'pve.damage', 'pve.encounter', 'player.effect_gain', 'player.effect_lose' ]
  pvp:
    icon: 'IRON_SWORD'
    minimum-priority: LOW
    include: [ 'pvp.*', 'death.*', 'player.big_damage', 'player.low_health', 'player.totem',
               'player.golden_apple', 'player.enchanted_golden_apple', 'game.*' ]
    exclude: [ 'pvp.attack', 'death.respawn' ]
  exploration:
    icon: 'COMPASS'
    minimum-priority: LOW
    include: [ 'world.*', 'mining.first_*', 'mining.diamond_count', 'mining.debris_count', 'mining.spawner_break',
               'game.*' ]
  caster:
    icon: 'JUKEBOX'
    minimum-priority: NORMAL
    include: [ 'pvp.combat_start', 'pvp.first_kill', 'pvp.double_kill', 'pvp.triple_kill', 'pvp.kill_streak',
               'pvp.streak_end', 'pvp.assist', 'player.low_health', 'player.totem', 'player.enchanted_golden_apple',
               'death.*', 'mining.first_diamond', 'mining.first_debris', 'mining.diamond_count',
               'world.nether_enter', 'world.end_enter', 'world.border_*', 'craft.first_craft', 'craft.amount',
               'enchant.level', 'pve.boss_kill', 'pve.dragon_*', 'pve.wither_*', 'game.*', '@custom' ]
    exclude: [ 'death.respawn' ]
  minimal:
    icon: 'GRAY_WOOL|WOOL:7'
    minimum-priority: LOW
    include: [ 'death.first_death', 'pvp.first_kill', 'death.killed_by_player', 'death.eliminated',
               'world.nether_enter', 'world.end_enter', 'player.totem', 'game.end', 'game.player_win', 'game.team_win' ]
  custom:
    icon: 'WRITABLE_BOOK|BOOK_AND_QUILL'
    minimum-priority: LOW
    include: [ '*' ]
