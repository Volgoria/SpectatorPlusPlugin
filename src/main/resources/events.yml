# ============================================================================
#                      SPECTATOR PLUS - ÉVÈNEMENTS DU CHAT
# ============================================================================
# Chaque évènement possède :
#   enabled  : true / false
#   priority : LOW, NORMAL, IMPORTANT, CRITICAL (filtre « niveau d'importance »)
#   message  : (optionnel) message imposé pour TOUTES les langues. Par défaut, les messages
#              sont dans les fichiers de langue : lang/<langue>.yml → event-messages
#   cooldown : délai minimum (secondes) entre deux messages pour un même joueur (optionnel)
#   + des paramètres propres à l'évènement (listes, seuils...)
#
# Listes : vide = tout accepter (sauf mention contraire). Les noms legacy (1.8-1.12)
# et modernes peuvent être mélangés. « * » en fin de nom = préfixe (ex : DIAMOND_*).
#
# Placeholders communs : {player} {world} {x} {y} {z} {health} {team}
#   {event_name} {event_category} {event_priority} {event_time} {spectator}
#   {online_players} {spectator_count} {alive_players} {server_tps} {world_time}
# Les noms et messages traduits sont dans lang/<langue>.yml (event-names / event-messages).
# Les évènements personnalisés (API) peuvent aussi être configurés ici :
#   ex : l'évènement « uhc.episode.start » se configure sous uhc: episode: start:
# ============================================================================

# Valeur de « enabled » pour les évènements natifs absents de ce fichier
default-enabled: true

# ---------------------------------------------------------------- MONDE ET DIMENSION
world:
  nether_enter:
    enabled: true
    priority: NORMAL
  nether_leave:
    enabled: true
    priority: LOW
  end_enter:
    enabled: true
    priority: IMPORTANT
  end_leave:
    enabled: true
    priority: NORMAL
  change:
    enabled: false
    priority: LOW
    # Mondes concernés (vide = tous)
    worlds: [ ]
  end_gateway:
    enabled: true
    priority: NORMAL
  nether_portal:
    enabled: false
    priority: LOW
  end_portal:
    enabled: true
    priority: IMPORTANT
  zone_enter:
    enabled: true
    priority: NORMAL
    # Zones concernées (ids de config.yml → zones, vide = toutes)
    zones: [ ]
  zone_leave:
    enabled: false
    priority: LOW
    zones: [ ]
  coordinate:
    enabled: false
    priority: NORMAL
    # Coordonnées à surveiller (y optionnel)
    targets:
      - { name: 'le centre', world: world, x: 0, z: 0, radius: 10 }
  structure:
    enabled: true
    priority: NORMAL
    # 1.19+ uniquement. Vide = toutes
    structures: [ STRONGHOLD, FORTRESS, BASTION_REMNANT, END_CITY, ANCIENT_CITY, MANSION, MONUMENT, TRIAL_CHAMBERS ]
  biome:
    enabled: false
    priority: LOW
    # Obligatoire : liste des biomes surveillés (noms legacy acceptés)
    biomes: [ MUSHROOM_FIELDS, MUSHROOM_ISLAND, BADLANDS, MESA, ICE_SPIKES, DEEP_DARK, CHERRY_GROVE ]
  altitude:
    enabled: false
    priority: LOW
    heights: [ 200 ]
  depth:
    enabled: false
    priority: LOW
    depths: [ 12, -40 ]
  spawn_away:
    enabled: false
    priority: LOW
    distances: [ 500, 1000 ]
  spawn_approach:
    enabled: false
    priority: NORMAL
    distances: [ 100 ]
  border_cross:
    enabled: true
    priority: NORMAL
    cooldown: 30
  border_start:
    enabled: true
    priority: IMPORTANT
  border_stop:
    enabled: true
    priority: NORMAL
  border_size:
    enabled: true
    priority: IMPORTANT
    sizes: [ 1000, 500, 250, 100 ]

